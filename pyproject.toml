[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus"
version = "1.0.0"
description = "Nexus - AI Gateway"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "夜小白科技有限公司", email = "contact@yexiaobai.com"}
]
keywords = ["ai", "gateway", "chatbot", "nexus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]",
    # WHY 锁 0.7.x:deepagents 0.7.0 起 GraphsState + FilesystemBackend 重写,
    # 配套要求 langchain>=1.3.14 + langchain-core>=1.5.0 + langsmith>=0.10.9。
    # langchain / langchain-core 上限留到 <2.0(官方明确 1.x → 2.x 是 breaking
    # 升级窗口);langsmith 无明确上限,只用下限。
    "deepagents>=0.7.0,<0.8.0",
    # WHY 显式声明 langchain / langchain-core / langsmith 下限:0.7 在 venv
    # ``pip install -e .`` 时不会自动装到满足 Requires-Dist 的版本,会导致
    # import 时 ``ModuleNotFoundError`` 或 API 漂移。补三个下限 + 上限避免
    # 漂到 2.x。
    "langchain>=1.3.14,<2.0.0",
    "langchain-core>=1.5.0,<2.0.0",
    "langsmith>=0.10.9",
    "langchain-openai>=1.0.0",
    "langchain-community>=0.0.20",
    # WHY 显式声明 ``langgraph-checkpoint-sqlite``:
    #   ``langgraph`` 1.2.x / ``deepagents`` 0.6.x 都不传递依赖这个子包
    #   (langgraph-checkpoint 是基类,sqlite 实现是独立可选包)。
    #   干净环境 ``pip install -e .`` 不会装它,导致
    #   ``nexus.backend.agent._checkpoint`` 在 import 时
    #   ``ModuleNotFoundError: No module named 'langgraph.checkpoint.sqlite'``,
    #   agent 懒构造失败,所有依赖 LLM 的 E2E test 拿到空回复
    #   (E2E multi-turn 2026-06-30 真实踩坑)。
    #   范围锁 2.0-4.0:跟 langgraph 1.x 配套,``<5`` 留给未来
    #   langgraph 2.0 重新评估。
    "langgraph-checkpoint-sqlite>=2.0,<4.0",
    "ddgs>=5.0.0",
    "beautifulsoup4>=4.12.0",
    "aiosqlite>=0.19.0",
    # WHY 显式声明 ``aiohttp``:fact_check.exchange_rate.fetch_rate
    #   需要异步 HTTP 客户端拉取 exchangerate-api 汇率;
    #   不在 fastapi 传递依赖里(uvicorn[standard] 用 httptools),
    #   ``pip install -e .`` 后 import 会失败,verifier 退化为 fail-open。
    "aiohttp>=3.9",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "rank-bm25>=0.2.0",
    "pywebview>=6.0 ; sys_platform == 'darwin'",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["nexus"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line length (由 formatter 处理)
    "B008",  # FastAPI 依赖注入里常见
]

[tool.black]
line-length = 120
target-version = ["py311", "py312"]